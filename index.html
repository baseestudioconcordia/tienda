<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BASE ESTUDIO | Remeras personalizadas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#151515;--line:#2a2a2a;--txt:#f5f5f5;--mut:#a3a3a3;--y:#ffc800;--p:#ff3d9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Arial,sans-serif}
h1,h2,h3,.bebas{font-family:'Bebas Neue',Impact,Arial,sans-serif;letter-spacing:.03em;font-weight:400;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0b0b0bee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:69px}
.logo{height:52px;filter:invert(1);display:none}
.logotxt{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:.05em}
.btn{background:var(--y);color:#000;border:0;border-radius:10px;padding:11px 16px;font:800 14px Inter,Arial,sans-serif;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.96)}.btn.p{background:var(--p);color:#fff}.btn.g{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.cartbtn{position:relative}.badge{position:absolute;top:-8px;right:-8px;background:var(--p);color:#fff;border-radius:99px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center}
.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.15)}}
.hero{padding:44px 16px 30px;text-align:center;background:radial-gradient(600px 260px at 15% 0,#ff3d9a33,transparent),radial-gradient(600px 260px at 85% 10%,#ffc80033,transparent)}
.hero>div{max-width:820px;margin:auto}
.hero h1{font-size:clamp(46px,11vw,96px);line-height:.92;margin-top:14px}.hero h1 span{color:var(--y)}
.hero p{color:var(--mut);max-width:540px;margin:14px auto}
.hero.bn p{color:#e5e5e5}
.tag{display:inline-block;background:var(--y);color:#000;font-weight:800;font-size:13px;padding:8px 14px;border-radius:6px;transform:rotate(-1.5deg)}
.mq{background:var(--y);color:#000;overflow:hidden;white-space:nowrap;padding:8px 0}
.mq div{display:inline-block;animation:mq 22s linear infinite;font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.06em}
@keyframes mq{to{transform:translateX(-50%)}}
.bar{position:sticky;top:calc(69px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font:600 14px Inter,Arial,sans-serif;cursor:pointer;transition:.15s}
.tab.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:1100px;margin:auto;padding:20px 16px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;animation:up .4s both}
.card:hover{transform:translateY(-4px);border-color:var(--y)}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.ph{aspect-ratio:4/5;background:#000;display:grid;place-items:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.card:hover .ph img{transform:scale(1.06)}
.ic{font-size:64px}.ph small,.sold{position:absolute;bottom:8px;left:8px;background:#000b;padding:3px 8px;border-radius:6px;font-size:11px;color:var(--y)}
.sold{top:8px;bottom:auto;background:var(--p);color:#fff;font-weight:800}
.info{padding:12px}.info h3{font-size:24px}.price{color:var(--y);font-weight:800;margin-top:2px}
.adm{display:flex;gap:6px;padding:0 12px 12px}.adm button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0b0b0b;color:var(--txt);cursor:pointer}
input,select,textarea{width:100%;background:#0b0b0b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px Inter,Arial,sans-serif}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.empty{color:var(--mut);text-align:center;padding:50px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#0b0b0b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font:600 14px Inter,Arial,sans-serif}.chip.on{background:var(--y);color:#000;border-color:var(--y)}
.ov{position:fixed;inset:0;background:#000a;z-index:40;display:none}.ov.on{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:#121212;z-index:50;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:30px}.db{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.it{display:flex;justify-content:space-between;gap:8px;background:var(--card);padding:10px;border-radius:10px;font-size:14px}
.it small{color:var(--mut)}.q{display:flex;align-items:center;gap:10px;margin-top:6px}.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#0b0b0b;color:var(--txt);cursor:pointer}
.df{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:#000b;overflow:auto}.modal.on{display:grid}
.mb{background:#121212;border:1px solid var(--line);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;animation:up .25s}
.qv{display:grid;gap:14px}.qv img{width:100%;max-height:52vh;object-fit:contain;background:#000;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;text-align:center}th,td{border:1px solid var(--line);padding:8px}th{color:var(--y)}
footer{border-top:1px solid var(--line);text-align:center;padding:28px 16px 40px;color:var(--mut);font-size:14px}
footer a{color:var(--y);text-decoration:none;margin:0 8px;font-weight:600}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25d366;color:#000;border-radius:99px;padding:12px 18px;font-weight:800;text-decoration:none;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--y);color:#000;font-weight:800;padding:10px 18px;border-radius:99px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#admin{background:var(--y);color:#000;padding:10px 16px;display:none;gap:8px;flex-wrap:wrap;align-items:center}#admin b{margin-right:auto}
#admin .btn{background:#000;color:#fff;padding:8px 12px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#0b0b0b;border:1px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:12px;color:var(--mut)}
.slot img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px}
.slot span{aspect-ratio:4/5;display:grid;place-items:center}
.slot .btn{padding:6px 8px;font-size:12px;width:100%}
.thumbs{display:flex;gap:8px}
.qv .th{width:64px;height:64px;max-height:none;object-fit:cover;border:2px solid var(--line);border-radius:8px;cursor:pointer}
.qv .th.on{border-color:var(--y)}
input[type=color]{padding:2px;height:40px}
input[type=range]{padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div><img class="logo" id="logo" alt="BASE ESTUDIO"><span class="logotxt" id="logotxt">BASE ESTUDIO</span></div>
  <div style="display:flex;gap:8px">
    <button class="btn g" onclick="showTalles()">Talles</button>
    <button class="btn cartbtn" id="cb" onclick="openCart()">🛒 Carrito<span class="badge" id="cnt">0</span></button>
  </div>
</header>
<div id="admin"></div>

<section class="hero" id="hero"><div>
  <span class="tag" id="h_tag"></span>
  <h1 id="h_t"></h1>
  <p id="h_sub"></p>
  <button class="btn" onclick="document.getElementById('bar').scrollIntoView()">Ver diseños ↓</button>
</div></section>
<div class="mq" id="mq"></div>

<div class="bar" id="bar"><nav class="tabs" id="tabs"></nav><input id="q" type="search" placeholder="🔍 Buscar diseño..." oninput="grid()"></div>
<main><div class="grid" id="grid"></div></main>

<footer>
  <div class="bebas" style="font-size:26px;color:var(--txt)">BASE ESTUDIO</div>
  <p id="ftxt" style="margin:6px 0 12px"></p>
  <a id="fb" href="#" target="_blank" rel="noopener">Facebook</a>
  <a id="ig" href="#" target="_blank" rel="noopener">Instagram</a>
  <a id="wlink" href="#" target="_blank" rel="noopener">WhatsApp</a>
</footer>
<a class="wa" id="wafab" href="#" target="_blank" rel="noopener">💬 Consultá por WhatsApp</a>
<div class="toast" id="toast"></div>

<div class="ov" id="ov" onclick="closeAll()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h2>TU PEDIDO</h2><button class="btn g" onclick="closeAll()">Cerrar</button></div>
  <div class="db" id="items"></div>
  <div class="df" id="foot">
    <input id="nom" placeholder="Tu nombre">
    <select id="ent"><option>Retiro en Concordia</option><option>Envío a domicilio (lo coordinamos)</option></select>
    <textarea id="nota" rows="2" placeholder="Notas (ej: quiero agregar un nombre o cambiar un detalle)"></textarea>
    <div class="tot"><span>Total</span><span id="tot">$0</span></div>
    <button class="btn p" onclick="send()">Enviar pedido por WhatsApp</button>
  </div>
</aside>
<div class="modal" id="modal" onclick="if(event.target===this)closeAll()"><div class="mb" id="mb"></div></div>

<script>
let WHATSAPP="5493454931740";
const TALLES=["S","M","L","XL","XXL","3XL"];

/* LOGO: si querés conservar tu logo actual, pegá acá entre comillas el
   "data:image/png;base64,..." del index.html viejo. Si no, subilo desde
   el editor (Personalizar página). Sin logo se muestra el nombre en texto. */
const LOGO_DEFAULT="";

/* Este DEFAULT es solo el respaldo. Tus productos reales viven en productos.json */
const DEFAULT={"categorias":[{"id":"anime","nombre":"Anime","icono":"⚡"},{"id":"autos","nombre":"Autos","icono":"🏎️"},{"id":"deporte","nombre":"Deporte","icono":"⚽"},{"id":"gaming","nombre":"Gaming","icono":"🎮"},{"id":"mascotas","nombre":"Mascotas","icono":"🐾"},{"id":"urbano","nombre":"Urbano","icono":"💀"},{"id":"personalizada","nombre":"Tu diseño","icono":"🎨"}],"productos":[{"id":"an2","cat":"anime","nombre":"Diseño anime","precio":18000,"colores":["Negro","Blanco"],"ejemplo":true},{"id":"au1","cat":"autos","nombre":"Diseño autos","precio":18000,"colores":["Negro","Blanco"],"ejemplo":true},{"id":"de1","cat":"deporte","nombre":"Diseño deportivo","precio":18000,"colores":["Negro","Blanco"],"ejemplo":true},{"id":"ga1","cat":"gaming","nombre":"Diseño gamer","precio":18000,"colores":["Negro","Blanco"],"ejemplo":true},{"id":"ma1","cat":"mascotas","nombre":"Tu mascota","precio":18000,"colores":["Negro","Blanco"],"ejemplo":true},{"id":"pe1","cat":"personalizada","nombre":"Tu diseño, tu idea","precio":20000,"colores":["Negro","Blanco"],"ejemplo":true}]};

const CFG_DEFAULT={logo:"",banner:"",overlay:55,tag:"SE LEVANTAN PEDIDOS PARA LA SEMANA",t1:"REMERAS",t2:"PERSONALIZADAS",sub:"100% algodón con estampado DTF de alta calidad. Elegí lo que quieras, de cualquier temática. ¡No te quedes sin la tuya!",marquee:"100% ALGODÓN ✦ ESTAMPADO DTF ✦ DISEÑO SIN LÍMITES ✦ ALTA CALIDAD",wsp:"5493454931740",footer:"Concordia, Entre Ríos · WhatsApp 345 493-1740",fb:"https://www.facebook.com/baseestudio",ig:"https://www.instagram.com/baseestudioconcordia",c1:"#ffc800",c2:"#ff3d9a"};

// CLAVE DE ACCESO — cambiá estos valores y no los compartas.
// Para entrar: tulink.com/?panelbase2026 y te pide el PIN.
const ADMIN_KEY="panelbase2026";
const ADMIN_PIN="4517";

const $=id=>document.getElementById(id);
const money=n=>"$"+Number(n).toLocaleString("es-AR");
const WANT_ADMIN=(location.search+location.hash).includes(ADMIN_KEY);
let ADMIN=false;
let DATA=null,cat="todas",cart=[],qv=null,fp=null,cf=null;
try{cart=JSON.parse(localStorage.getItem("be_cart")||"[]")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("be_cart",JSON.stringify(cart))}catch(e){}};
const wurl=t=>"https://wa.me/"+WHATSAPP+(t?"?text="+encodeURIComponent(t):"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOf=id=>DATA.categorias.find(c=>c.id===id)||{icono:"👕",nombre:""};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h+"_"+s.length};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)}
function show(h){$("mb").innerHTML=h;$("modal").classList.add("on")}

/* ---------- datos y configuración ---------- */
function norm(d){
  d=JSON.parse(JSON.stringify(d));
  d.config={...CFG_DEFAULT,...(d.config||{})};
  d.productos.forEach(p=>{if(!p.imgs)p.imgs=p.img?[p.img]:[];delete p.img});
  return d;
}
function applyConfig(){
  const c=DATA.config,r=document.documentElement.style;
  r.setProperty("--y",c.c1);r.setProperty("--p",c.c2);
  const logo=c.logo||LOGO_DEFAULT;
  $("logo").style.display=logo?"block":"none";$("logotxt").style.display=logo?"none":"block";
  if(logo)$("logo").src=logo;
  $("h_tag").textContent=c.tag;$("h_tag").style.display=c.tag?"":"none";
  $("h_t").innerHTML=esc(c.t1)+" <span>"+esc(c.t2)+"</span>";
  $("h_sub").textContent=c.sub;
  const o=c.overlay/100;
  $("hero").style.background=c.banner?`linear-gradient(rgba(0,0,0,${o}),rgba(0,0,0,${o})),url("${c.banner}") center/cover`:"";
  $("hero").classList.toggle("bn",!!c.banner);
  $("mq").innerHTML="<div>"+esc((c.marquee+" ✦ ").repeat(8))+"</div>";
  WHATSAPP=String(c.wsp).replace(/\D/g,"");
  $("wlink").href=wurl("Hola BASE ESTUDIO!");
  $("wafab").href=wurl("Hola BASE ESTUDIO! Quería consultar por una remera.");
  $("fb").href=c.fb;$("ig").href=c.ig;$("ftxt").textContent=c.footer;
}
function resize(file,max,q,type){
  return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(type,q))};im.src=r.result};r.readAsDataURL(file)});
}

/* ---------- catálogo ---------- */
function tabs(){
  const all=[{id:"todas",nombre:"Todas",icono:"🔥"},...DATA.categorias];
  $("tabs").innerHTML=all.map(c=>`<button class="tab ${c.id===cat?"on":""}" onclick="setCat('${c.id}')">${c.icono} ${esc(c.nombre)}</button>`).join("");
}
function setCat(c){cat=c;tabs();grid()}
function grid(){
  const s=($("q").value||"").toLowerCase();
  const list=DATA.productos.filter(p=>(cat==="todas"||p.cat===cat)&&p.nombre.toLowerCase().includes(s));
  if(!list.length){$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">Pronto vamos a sumar diseños acá. ¡Consultanos por WhatsApp!</div>';return}
  $("grid").innerHTML=list.map((p,i)=>`<article class="card" style="animation-delay:${i*40}ms" onclick="quick('${p.id}')">
    <div class="ph">${p.imgs[0]?`<img loading="lazy" src="${p.imgs[0]}" alt="${esc(p.nombre)}">`:`<span class="ic">${catOf(p.cat).icono}</span>`}${p.agotado?'<b class="sold">AGOTADO</b>':""}${p.ejemplo?"<small>Ejemplo</small>":""}${p.imgs.length>1?`<small style="left:auto;right:8px">📷 ${p.imgs.length}</small>`:""}</div>
    <div class="info"><h3>${esc(p.nombre)}</h3><div class="price">${money(p.precio)}</div></div>
    ${ADMIN?`<div class="adm"><button onclick="event.stopPropagation();editP('${p.id}')">✏️ Editar</button><button onclick="event.stopPropagation();delP('${p.id}')">🗑</button></div>`:""}</article>`).join("");
}
function quick(id){
  const p=DATA.productos.find(x=>x.id===id);qv={p,t:"M",c:p.colores[0],q:1,i:0};drawQ();
}
function setImg(i){
  qv.i=i;$("gimg").src=qv.p.imgs[i];
  document.querySelectorAll(".th").forEach((e,j)=>e.classList.toggle("on",j===i));
}
function drawQ(){
  const {p,t,c,q,i}=qv,im=p.imgs;
  show(`<div class="qv">${im.length?`<img id="gimg" src="${im[i]||im[0]}" alt="${esc(p.nombre)}">`:""}
  ${im.length>1?`<div class="thumbs">${im.map((x,j)=>`<img class="th ${j===i?"on":""}" src="${x}" alt="" onclick="setImg(${j})">`).join("")}</div>`:""}
  <div><h2 style="font-size:36px">${esc(p.nombre)}</h2><div class="price" style="font-size:20px">${money(p.precio)}</div></div>
  <div><label>Talle <a href="#" style="color:var(--y)" onclick="showTalles();return false">ver medidas</a></label><div class="chips">${TALLES.map(x=>`<button class="chip ${x===t?"on":""}" onclick="qv.t='${x}';drawQ()">${x}</button>`).join("")}</div></div>
  <div><label>Color</label><div class="chips">${p.colores.map(x=>`<button class="chip ${x===c?"on":""}" onclick="qv.c='${x}';drawQ()">${esc(x)}</button>`).join("")}</div></div>
  <div class="q"><button onclick="qv.q=Math.max(1,qv.q-1);drawQ()">−</button><b>${q}</b><button onclick="qv.q++;drawQ()">+</button><span style="margin-left:auto;font-weight:800">${money(p.precio*q)}</span></div>
  <button class="btn p" ${p.agotado?"disabled":""} onclick="add()">${p.agotado?"Agotado - consultanos":"Agregar al carrito"}</button>
  <button class="btn g" onclick="closeAll()">Seguir viendo</button></div>`);
}
function showTalles(){show(`<h2 style="font-size:30px;margin-bottom:10px">TABLA DE TALLES <small style="font-size:13px;color:var(--mut);font-family:Inter">(cm)</small></h2>
<table><tr><th></th><th>S</th><th>M</th><th>L</th><th>XL</th><th>XXL</th><th>3XL</th></tr><tr><td>Ancho</td><td>52</td><td>54</td><td>56</td><td>59</td><td>62</td><td>64</td></tr><tr><td>Largo</td><td>60</td><td>62</td><td>70</td><td>72</td><td>74</td><td>80</td></tr></table>
<button class="btn" style="margin-top:14px" onclick="closeAll()">Cerrar</button>`)}

/* ---------- carrito ---------- */
function add(){
  const {p,t,c,q}=qv,k=p.id+t+c,f=cart.find(x=>x.k===k);
  f?f.q+=q:cart.push({k,n:p.nombre,t,c,pr:p.precio,q});
  saveCart();render();closeAll();toast("✓ Agregado al carrito");$("cb").classList.remove("bump");void $("cb").offsetWidth;$("cb").classList.add("bump");
}
function chg(k,d){const f=cart.find(x=>x.k===k);f.q+=d;if(f.q<1)cart=cart.filter(x=>x.k!==k);saveCart();render()}
function render(){
  $("cnt").textContent=cart.reduce((a,b)=>a+b.q,0);
  $("items").innerHTML=cart.length?cart.map(i=>`<div class="it"><div><b>${esc(i.n)}</b><br><small>Talle ${i.t} · ${esc(i.c)}</small><div class="q"><button onclick="chg('${i.k}',-1)">−</button>${i.q}<button onclick="chg('${i.k}',1)">+</button></div></div><b>${money(i.pr*i.q)}</b></div>`).join(""):'<div class="empty">Tu carrito está vacío</div>';
  $("tot").textContent=money(cart.reduce((a,b)=>a+b.pr*b.q,0));
  $("foot").style.display=cart.length?"flex":"none";
}
function send(){
  if(!cart.length)return;
  const tot=cart.reduce((a,b)=>a+b.pr*b.q,0);
  const lines=cart.map(i=>`• ${i.q}x ${i.n} (Talle ${i.t}, ${i.c}) - ${money(i.pr*i.q)}`).join("\n");
  window.open(wurl(`Hola BASE ESTUDIO! Quiero hacer este pedido:\n\n${lines}\n\nTotal: ${money(tot)}\nNombre: ${$("nom").value||"-"}\nEntrega: ${$("ent").value}\nNotas: ${$("nota").value||"-"}`),"_blank");
}
function openCart(){$("drawer").classList.add("on");$("ov").classList.add("on")}
function closeAll(){["drawer","ov","modal"].forEach(i=>$(i).classList.remove("on"))}

/* ---------- modo editor ---------- */
function persist(msg){try{localStorage.setItem("be_draft",JSON.stringify(DATA));toast(msg||"Guardado en borrador")}catch(e){toast("⚠ Borrador lleno: descargá el JSON ahora")}tabs();grid();applyConfig();if(ADMIN)adminBar()}
function adminBar(){
  const a=$("admin");a.style.display="flex";
  a.innerHTML=`<b>✏️ MODO EDITOR</b><button class="btn" onclick="editP()">＋ Producto</button><button class="btn" onclick="catsM()">Categorías</button><button class="btn" onclick="cfgM()">🎨 Personalizar página</button><button class="btn" onclick="dl()">⬇ Descargar productos.json</button><button class="btn" onclick="if(confirm('¿Volver a la versión publicada?')){localStorage.removeItem('be_draft');location.reload()}">Descartar cambios</button><button class="btn" onclick="try{sessionStorage.removeItem('be_auth')}catch(e){}location.reload()">🔒 Salir</button>`;
}
function editP(id){
  fp=id?{...DATA.productos.find(x=>x.id===id)}:{id:"",cat:DATA.categorias[0].id,nombre:"",precio:18000,colores:["Negro","Blanco"],imgs:[]};
  fp.imgs=[...(fp.imgs||[])];
  show(`<h2 style="font-size:30px">${id?"EDITAR":"NUEVO"} PRODUCTO</h2>
  <label>Fotos (hasta 3, la primera es la principal)</label><div class="slots" id="slots"></div>
  <label>Nombre del diseño</label><input id="f_n" value="${esc(fp.nombre)}">
  <label>Categoría</label><select id="f_c">${DATA.categorias.map(c=>`<option value="${c.id}" ${c.id===fp.cat?"selected":""}>${c.icono} ${esc(c.nombre)}</option>`).join("")}</select>
  <label>Precio ($)</label><input id="f_p" type="number" value="${fp.precio}">
  <label>Colores (separados por coma)</label><input id="f_col" value="${esc(fp.colores.join(", "))}">
  <label style="display:flex;gap:8px;align-items:center"><input id="f_a" type="checkbox" style="width:auto" ${fp.agotado?"checked":""}> Marcar como agotado</label>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn p" onclick="saveP()">Guardar</button><button class="btn g" onclick="closeAll()">Cancelar</button></div>`);
  slots();
}
function slots(){
  $("slots").innerHTML=[0,1,2].map(i=>{const s=fp.imgs[i];
    return `<div class="slot">${s?`<img src="${s}" alt="">`:`<span>Foto ${i+1}${i===0?"<br>(principal)":""}</span>`}
    <button class="btn g" onclick="this.parentNode.querySelector('input').click()">${s?"Cambiar":"Subir"}</button><input type="file" accept="image/*" hidden onchange="photo(this,${i})">
    ${s?`<button class="btn g" onclick="fp.imgs.splice(${i},1);slots()">Quitar</button>`:""}</div>`}).join("");
}
async function photo(inp,i){
  const f=inp.files[0];if(!f)return;
  fp.imgs[Math.min(i,fp.imgs.length)]=await resize(f,800,.72,"image/jpeg");
  slots();
}
function saveP(){
  const n=$("f_n").value.trim();if(!n){toast("Poné un nombre");return}
  const cols=$("f_col").value.split(",").map(x=>x.trim()).filter(Boolean);
  Object.assign(fp,{nombre:n,cat:$("f_c").value,precio:Number($("f_p").value)||0,colores:cols.length?cols:["Único"],agotado:$("f_a").checked});delete fp.ejemplo;delete fp.img;
  const i=DATA.productos.findIndex(x=>x.id===fp.id);
  if(i>=0)DATA.productos[i]=fp;else{fp.id="p"+Date.now();DATA.productos.unshift(fp)}
  closeAll();persist("✓ Producto guardado (falta publicar)");
}
function delP(id){if(confirm("¿Borrar este producto?")){DATA.productos=DATA.productos.filter(x=>x.id!==id);persist("Producto borrado")}}
function catsM(){
  show(`<h2 style="font-size:30px">CATEGORÍAS</h2>${DATA.categorias.map(c=>`<div class="it" style="margin:6px 0;align-items:center"><span>${c.icono} ${esc(c.nombre)}</span><button class="btn g" onclick="delC('${c.id}')">Borrar</button></div>`).join("")}
  <label>Nueva categoría</label><div style="display:flex;gap:6px"><input id="nc_i" placeholder="🎸" style="width:70px"><input id="nc_n" placeholder="Ej: Música"></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn p" onclick="addC()">Agregar</button><button class="btn g" onclick="closeAll()">Cerrar</button></div>`);
}
function addC(){
  const n=$("nc_n").value.trim();if(!n)return;
  const id=n.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-")+"-"+(DATA.categorias.length+1);
  DATA.categorias.push({id,nombre:n,icono:$("nc_i").value.trim()||"👕"});persist("✓ Categoría agregada");catsM();
}
function delC(id){
  if(DATA.productos.some(p=>p.cat===id)){toast("Movelos o borralos primero");return}
  DATA.categorias=DATA.categorias.filter(c=>c.id!==id);persist("Categoría borrada");catsM();
}
function cfgM(){
  cf={...DATA.config};
  const inp=(k,l)=>`<label>${l}</label><input value="${esc(cf[k])}" oninput="cf['${k}']=this.value">`;
  show(`<h2 style="font-size:30px">PERSONALIZAR PÁGINA</h2>
  <label>Banner de fondo (foto grande)</label>
  <img id="pv_banner" alt="" style="max-height:120px;border-radius:10px;margin-bottom:6px;display:none">
  <input type="file" accept="image/*" onchange="cfgImg(this,'banner')">
  <button class="btn g" style="margin-top:6px" onclick="cf.banner='';cfgPrev()">Quitar banner</button>
  <label>Oscuridad sobre el banner (para que se lea el texto)</label>
  <input type="range" min="0" max="90" value="${cf.overlay}" oninput="cf.overlay=+this.value">
  <label>Logo (PNG, se muestra invertido a blanco)</label>
  <img id="pv_logo" alt="" style="max-height:60px;background:#fff;border-radius:6px;margin-bottom:6px;display:none">
  <input type="file" accept="image/*" onchange="cfgImg(this,'logo')">
  <button class="btn g" style="margin-top:6px" onclick="cf.logo='';cfgPrev()">Volver al logo original</button>
  ${inp("tag","Etiqueta de arriba (vacía = se oculta)")}
  ${inp("t1","Título (parte blanca)")}${inp("t2","Título (parte de color)")}
  <label>Subtítulo</label><textarea rows="3" oninput="cf.sub=this.value">${esc(cf.sub)}</textarea>
  ${inp("marquee","Texto de la cinta que se mueve")}
  ${inp("wsp","WhatsApp (con código de país, ej: 5493454931740)")}
  ${inp("footer","Texto del pie de página")}
  ${inp("fb","Link de Facebook")}${inp("ig","Link de Instagram")}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><label>Color principal</label><input type="color" value="${cf.c1}" oninput="cf.c1=this.value"></div>
    <div><label>Color secundario</label><input type="color" value="${cf.c2}" oninput="cf.c2=this.value"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
    <button class="btn p" onclick="saveCfg()">Guardar</button>
    <button class="btn g" onclick="closeAll()">Cancelar</button>
    <button class="btn g" onclick="if(confirm('¿Volver a los textos y colores originales?')){DATA.config={...CFG_DEFAULT};persist('Restablecido');closeAll()}">Restablecer</button>
  </div>`);
  cfgPrev();
}
function cfgPrev(){["banner","logo"].forEach(k=>{const e=$("pv_"+k);e.src=cf[k]||"";e.style.display=cf[k]?"block":"none"})}
async function cfgImg(inp,k){
  const f=inp.files[0];if(!f)return;
  cf[k]=k==="logo"?await resize(f,400,1,"image/png"):await resize(f,1600,.7,"image/jpeg");
  cfgPrev();
}
function saveCfg(){DATA.config=cf;closeAll();persist("✓ Personalización guardada (falta publicar)")}
function dl(){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA)],{type:"application/json"}));a.download="productos.json";a.click();
  toast("Subí ese archivo a GitHub reemplazando productos.json");
}

/* ---------- acceso ---------- */
function checkAdmin(){
  if(!WANT_ADMIN)return;
  let ok=false;
  try{ok=sessionStorage.getItem("be_auth")==="1"}catch(e){}
  if(!ok){
    const p=prompt("Clave de acceso:");
    if(p!==null&&p===ADMIN_PIN){ok=true;try{sessionStorage.setItem("be_auth","1")}catch(e){}}
    else if(p!==null){alert("Clave incorrecta.")}
  }
  ADMIN=ok;
  if(location.search||location.hash)history.replaceState(null,"",location.pathname);
}

/* ---------- inicio ---------- */
async function init(){
  checkAdmin();
  DATA=norm(DEFAULT);
  let pub=null;
  try{
    const r=await fetch("productos.json?v="+Date.now(),{cache:"no-store"});
    if(r.ok){
      const txt=await r.text();
      const j=JSON.parse(txt);
      if(j.productos&&j.categorias){DATA=norm(j);pub=hash(txt)}
      else toast("⚠ productos.json tiene un formato incorrecto");
    }else toast("⚠ No se encontró productos.json ("+r.status+")");
  }catch(e){toast("⚠ Error al leer productos.json")}
  if(ADMIN){
    try{
      const base=localStorage.getItem("be_base");
      if(pub&&base!==null&&base!==pub)localStorage.removeItem("be_draft");
      if(pub)localStorage.setItem("be_base",pub);
      const d=JSON.parse(localStorage.getItem("be_draft")||"null");
      if(d&&d.productos)DATA=norm(d);
    }catch(e){}
    adminBar();
  }
  applyConfig();tabs();grid();render();
}
init();
</script>
</body>
</html>
